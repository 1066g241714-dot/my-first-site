    <title>岸元大和のサイト</title>
    <link rel="stylesheet "href=style.css>
    <script>
        let jikan = new Date();
        let hour = jikan.getHours();
        let minute = jikan.getMinutes();
        let second = jikan.getSeconds();
        let year = jikan.getFullYear()-2018;
        let month=jikan.getMonth()+1;
        let date=jikan.getDate();
        let weekday=jikan.getDay();
        window.alert("今日は令和" + year + "年" +month + "月" + date + "日です。");
        if (weekday== 4){
            window.alert("今日は木曜日です。"
            );
        }else{
            window.alert("今日は木曜日ではありません。");
        }
        
        window.alert("ようこそ！現在は" + hour + "時" + minute + "分" + second + "秒です。");
    </script >
